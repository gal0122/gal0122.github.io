<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">턱과 입 주변 여드름, 이런 요인이 겹칩니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">성인 여드름은 턱과 입 주변, 턱선에 반복되는 경우가 많습니다.</text><rect x="60.0" y="170" width="252.0" height="230.5" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">호르몬</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">생리 전후로</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">심해지기도</text><rect x="336.0" y="170" width="252.0" height="230.5" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="382.0" cy="220" r="20" fill="#2f5241"/><text x="382.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="416.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">스트레스 ·</text><text x="416.0" y="264" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">수면</text><text x="364.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">피지와 피부 회복에</text><text x="364.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">영향</text><rect x="612.0" y="170" width="252.0" height="230.5" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="658.0" cy="220" r="20" fill="#2f5241"/><text x="658.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="692.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">마찰</text><text x="640.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">마스크, 턱 괴기,</text><text x="640.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">휴대전화</text><rect x="888.0" y="170" width="252.0" height="230.5" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="934.0" cy="220" r="20" fill="#2f5241"/><text x="934.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="968.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">화장품</text><text x="916.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">유분이 많거나</text><text x="916.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">모공을 막는 제품</text><rect x="60" y="428.5" width="1080" height="92" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="468.5" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="468" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">생리가 불규칙하거나 털이 갑자기 늘었다면 호르몬 이상이 원인일 수 있어 산부인과나 내과 검사를 먼저 받아</text><text x="108" y="499" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">보세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>