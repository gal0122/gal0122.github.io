<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">여름 전에 끝내려면 겨울에 시작하세요</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">팔·다리는 한 시점에 성장기인 털이 약 20%로 다른 부위보다 적습니다.</text><line x1="210" y1="260" x2="990" y2="260" stroke="#b9ab86" stroke-width="6" stroke-linecap="round"/><circle cx="210.0" cy="260" r="22" fill="#2f5241" stroke="#fff" stroke-width="4"/><text x="210.0" y="214" font-size="25" font-weight="800" fill="#2f5241" text-anchor="middle">겨울~초봄</text><text x="210.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">시작</text><text x="210.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">4주 간격</text><circle cx="600.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="600.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">봄</text><text x="600.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">몇 회 뒤 털이</text><text x="600.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">가늘어지고 느리게 자람</text><circle cx="990.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="990.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">여름</text><text x="990.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">약 6개월 뒤</text><text x="990.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">1사이클 마무리</text><rect x="60" y="438" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="478" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="478" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">햇볕에 그을렸거나 태닝한 직후에는 화상과 색소침착 위험이 커져, 시술 전에 꼭 말씀해 주세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>