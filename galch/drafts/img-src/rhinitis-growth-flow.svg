<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">자주 아프면 성장에 쓸 힘이 줄어듭니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">성장호르몬은 깊이 잠든 동안 많이 나옵니다.</text><rect x="60.0" y="180" width="322.6666666666667" height="230.5" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="230" r="20" fill="#2f5241"/><text x="106.0" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">코막힘 · 잦은 감기</text><text x="88.0" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">입을 벌리고 자거나</text><text x="88.0" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">자주 뒤척임</text><path d="M392.6666666666667 295.25 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="438.6666666666667" y="180" width="322.6666666666667" height="230.5" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="484.6666666666667" cy="230" r="20" fill="#2f5241"/><text x="484.6666666666667" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="518.6666666666667" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">잠과 식욕이 흔들림</text><text x="466.6666666666667" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">자주 깨고</text><text x="466.6666666666667" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">입맛이 떨어짐</text><path d="M771.3333333333334 295.25 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="817.3333333333334" y="180" width="322.6666666666667" height="230.5" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="863.3333333333334" cy="230" r="20" fill="#2f5241"/><text x="863.3333333333334" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="897.3333333333334" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">성장에 쓸 힘이</text><text x="897.3333333333334" y="274" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">줄어듦</text><text x="845.3333333333334" y="316" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">회복에 먼저</text><text x="845.3333333333334" y="352" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">힘을 쓰게 됨</text><rect x="60" y="438.5" width="1080" height="61" rx="16" fill="#eef3ef" stroke="#2f5241" stroke-width="2"/><circle cx="90" cy="471.5" r="7" fill="#2f5241"/><text x="108" y="478" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">코골이가 심하고 자다가 숨을 멈추는 모습이 보이면 이비인후과 진료를 받아 보세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>