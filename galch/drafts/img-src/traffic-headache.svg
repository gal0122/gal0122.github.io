<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">교통사고 후 두통, 먼저 이것부터 구분합니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">머리와 목이 앞뒤로 흔들리면 목 주변 근육이 긴장해 두통과 어지럼이 생기기 쉽습니다.</text><rect x="60.0" y="170" width="524.0" height="293.0" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">흔한 사고 후 두통</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">목·어깨 근육의 긴장</text><circle cx="100.0" cy="317.5" r="5" fill="#2f5241"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">뒷머리·관자놀이가 조이듯 아픔</text><circle cx="100.0" cy="359.0" r="5" fill="#2f5241"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">어지럼, 귀울림, 눈의 피로</text><circle cx="100.0" cy="400.5" r="5" fill="#2f5241"/><text x="118.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">며칠 뒤 시작되기도 함</text><rect x="616.0" y="170" width="524.0" height="293.0" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#a8452f"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#a8452f" text-anchor="start">바로 큰 병원으로</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">이런 신호가 하나라도 있으면</text><circle cx="656.0" cy="317.5" r="5" fill="#a8452f"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">두통과 구토가 점점 심해짐</text><circle cx="656.0" cy="359.0" r="5" fill="#a8452f"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">의식을 잃었던 경우</text><circle cx="656.0" cy="400.5" r="5" fill="#a8452f"/><text x="674.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">힘이 빠지거나 말이 어눌해짐</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>