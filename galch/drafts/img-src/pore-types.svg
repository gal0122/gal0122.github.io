<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">모공은 원인에 따라 모양이 다릅니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">모공 입구는 깨끗하게, 모공을 받쳐 주는 진피는 탄탄하게 관리합니다.</text><rect x="60.0" y="170" width="344.0" height="370" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">피지 모공</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">둥글고 넓게 열림</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">코·이마, 지성 피부</text><rect x="90.0" y="360" width="284.0" height="140" rx="18" fill="#f1e2cf"/><circle cx="232.0" cy="430" r="34" fill="#c49a7c"/><circle cx="232.0" cy="430" r="18" fill="#8a5a3c"/><rect x="428.0" y="170" width="344.0" height="370" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">늘어진 모공</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">아래로 길게 늘어짐</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">볼, 나이가 들며</text><rect x="458.0" y="360" width="284.0" height="140" rx="18" fill="#f1e2cf"/><path d="M600.0 386 C634.0 430, 626.0 480, 600.0 480 C574.0 480, 566.0 430, 600.0 386z" fill="#c49a7c"/><rect x="796.0" y="170" width="344.0" height="370" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">흉터 모공</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">모양이 고르지 않게 패임</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">여드름을 앓은 자리</text><rect x="826.0" y="360" width="284.0" height="140" rx="18" fill="#f1e2cf"/><path d="M928.0 410 l26 -16 l30 10 l22 -8 l6 34 l-18 30 l-34 6 l-30 -14z" fill="#c49a7c"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>