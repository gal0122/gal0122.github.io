<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">실의 종류에 따라 역할이 다릅니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">개수보다 어디를 어느 방향으로 옮길지가 더 중요합니다.</text><rect x="60.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">모노실</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">표면이 매끈한 가는 실</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">피부 탄력과 피부결</text><rect x="428.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">코그실</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">표면에 미세한 돌기</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">처진 조직을 옮기고 지지</text><rect x="796.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">채움실 · 볼륨실</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">입체 구조</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">꺼진 부위의 볼륨 보완</text><rect x="60" y="398" width="1080" height="92" rx="16" fill="#eef3ef" stroke="#2f5241" stroke-width="2"/><circle cx="90" cy="431" r="7" fill="#2f5241"/><text x="108" y="438" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">실은 시간이 지나며 녹아 없어지고, 보통 1회 시술 후 1년 이후에 상태를 다시 봅니다. 유지 기간에는</text><text x="108" y="468" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">개인차가 큽니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>