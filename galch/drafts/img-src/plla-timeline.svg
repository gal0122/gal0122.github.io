<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">PLLA는 천천히 차오릅니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">채워 넣는 시술이 아니라, 콜라겐 생성을 이끌어 차오르게 돕는 시술입니다.</text><line x1="210" y1="260" x2="990" y2="260" stroke="#b9ab86" stroke-width="6" stroke-linecap="round"/><circle cx="210.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="210.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">시술 직후</text><text x="210.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">수분으로 잠시 차 보임</text><text x="210.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">며칠 안에 가라앉음</text><circle cx="600.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="600.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">약 1~2개월</text><text x="600.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">콜라겐이</text><text x="600.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">만들어지기 시작</text><circle cx="990.0" cy="260" r="22" fill="#2f5241" stroke="#fff" stroke-width="4"/><text x="990.0" y="214" font-size="25" font-weight="800" fill="#2f5241" text-anchor="middle">약 3개월 이후</text><text x="990.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">볼륨과 탄력이</text><text x="990.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">서서히 자리 잡음</text><rect x="60" y="438" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="478" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="478" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">드물게 피부 아래 작은 알갱이가 만져질 수 있어, 오래가면 연락해 주세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>