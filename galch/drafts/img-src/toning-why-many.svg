<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">토닝은 약하게, 여러 번 나누어 합니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">기미처럼 자극에 예민한 색소는 한 번에 강하게 치료하면 오히려 짙어질 수 있습니다.</text><rect x="60.0" y="170" width="524.0" height="293.0" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#a8452f"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#a8452f" text-anchor="start">강하게 한 번</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">예민한 색소에는</text><circle cx="100.0" cy="317.5" r="5" fill="#a8452f"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">자극이 커서</text><circle cx="100.0" cy="359.0" r="5" fill="#a8452f"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">오히려 짙어질 수 있음</text><rect x="616.0" y="170" width="524.0" height="293.0" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">약하게 여러 번</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">레이저토닝</text><circle cx="656.0" cy="317.5" r="5" fill="#2f5241"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">낮은 세기로 얼굴 전체에 고르게</text><circle cx="656.0" cy="359.0" r="5" fill="#2f5241"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">조금씩 옅게</text><circle cx="656.0" cy="400.5" r="5" fill="#2f5241"/><text x="674.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">경과를 보며 세기·횟수 조정</text><rect x="60" y="491.0" width="1080" height="61" rx="16" fill="#eef3ef" stroke="#2f5241" stroke-width="2"/><circle cx="90" cy="524.0" r="7" fill="#2f5241"/><text x="108" y="531" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">기미는 호르몬과 자외선의 영향으로 다시 생길 수 있어 자외선 차단을 함께 지켜야 합니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>