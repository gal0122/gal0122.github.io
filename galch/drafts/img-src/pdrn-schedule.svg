<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">PDRN은 간격을 두고 쌓아 가는 시술입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">피부가 재생하고 콜라겐이 새로 만들어지는 데는 시간이 걸립니다.</text><line x1="210" y1="260" x2="990" y2="260" stroke="#b9ab86" stroke-width="6" stroke-linecap="round"/><circle cx="210.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="210.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">1회</text><text x="210.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">2~4주 간격으로</text><circle cx="470.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="470.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">2~3회</text><text x="470.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">피부결 변화를</text><text x="470.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">느끼는 경우가 많음</text><circle cx="730.0" cy="260" r="22" fill="#2f5241" stroke="#fff" stroke-width="4"/><text x="730.0" y="214" font-size="25" font-weight="800" fill="#2f5241" text-anchor="middle">3~5회</text><text x="730.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">기본 일정</text><text x="730.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">마무리</text><circle cx="990.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="990.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">이후</text><text x="990.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">피부 상태에 맞춰</text><text x="990.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">유지 관리</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>