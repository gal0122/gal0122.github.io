<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">힘줄이 통로를 지날 때 걸립니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">손을 반복해서 많이 쓰면 힘줄과 통로가 붓고 두꺼워집니다.</text><rect x="60" y="180" width="1080" height="190" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="120" y="260" width="760" height="34" rx="17" fill="#e9d7b6" stroke="#c9a54a" stroke-width="2"/><rect x="500" y="238" width="90" height="78" rx="14" fill="none" stroke="#2f5241" stroke-width="6"/><text x="545" y="224" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="middle">힘줄 통로</text><text x="140" y="224" font-size="19" font-weight="700" fill="#7a6b42">손가락을 굽히는 힘줄</text><text x="1100" y="286" font-size="26" font-weight="800" fill="#2f5241" text-anchor="end">부드럽게 지나감</text><rect x="60" y="400" width="1080" height="190" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="120" y="480" width="760" height="34" rx="17" fill="#e9d7b6" stroke="#c9a54a" stroke-width="2"/><ellipse cx="420" cy="497" rx="46" ry="34" fill="#e2c26e" stroke="#c9a54a" stroke-width="3"/><rect x="500" y="458" width="90" height="78" rx="14" fill="none" stroke="#a8452f" stroke-width="10"/><text x="545" y="444" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="middle">힘줄 통로</text><text x="140" y="444" font-size="19" font-weight="700" fill="#7a6b42">손가락을 굽히는 힘줄</text><text x="1100" y="506" font-size="26" font-weight="800" fill="#a8452f" text-anchor="end">두꺼워져 걸림</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>