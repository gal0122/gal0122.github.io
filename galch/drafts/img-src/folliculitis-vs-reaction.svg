<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">흔한 반응일까요, 모낭염일까요?</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">시술 직후 털구멍 주변이 붉고 붓는 것은 흔한 반응입니다.</text><rect x="60.0" y="170" width="524.0" height="293.0" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">시술 직후 반응</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">레이저가 모낭에 닿았다는 신호</text><circle cx="100.0" cy="317.5" r="5" fill="#2f5241"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">시술 직후 생김</text><circle cx="100.0" cy="359.0" r="5" fill="#2f5241"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">털구멍 주변이 고르게 붉고 부음</text><circle cx="100.0" cy="400.5" r="5" fill="#2f5241"/><text x="118.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">하루 안에 가라앉음</text><rect x="616.0" y="170" width="524.0" height="293.0" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#8a6d3b"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#8a6d3b" text-anchor="start">모낭염</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">털구멍에 생긴 염증</text><circle cx="656.0" cy="317.5" r="5" fill="#8a6d3b"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">하루에서 며칠 뒤 생김</text><circle cx="656.0" cy="359.0" r="5" fill="#8a6d3b"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">털구멍을 따라 좁쌀·고름</text><circle cx="656.0" cy="400.5" r="5" fill="#8a6d3b"/><text x="674.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">며칠 이어지거나 늘어날 수 있음</text><rect x="60" y="491.0" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="531.0" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="531" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">짜거나 긁지 마세요. 붉음과 통증이 점점 심해지거나 물집·진물이 생기면 바로 연락해 주세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>