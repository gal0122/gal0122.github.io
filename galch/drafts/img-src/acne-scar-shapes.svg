<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">여드름 흉터, 모양에 따라 치료가 다릅니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">염증이 진피까지 번져 콜라겐이 손상되면 패인 흉터가 남습니다.</text><rect x="60" y="210" width="640" height="90" fill="#f1e2cf"/><rect x="60" y="300" width="640" height="230" fill="#ecd3c3"/><rect x="60" y="530" width="640" height="110" fill="#f6ead9"/><line x1="60" y1="300" x2="700" y2="300" stroke="#c9a98f" stroke-width="3" stroke-dasharray="10 8"/><text x="684" y="244" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">표피</text><text x="684" y="340" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">진피</text><text x="684" y="570" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">피하지방</text><path d="M106.80000000000001 209 L128.8 330 L150.8 209z" fill="#faf7f0"/><path d="M278.8 209 L284.8 262 H372.8 L378.8 209z" fill="#faf7f0"/><path d="M448.8 209 Q528.8 280 608.8 209z" fill="#faf7f0"/><path d="M528.8 246 q-20 60 -60 120 M528.8 246 q20 60 60 120" stroke="#b98d70" stroke-width="4" fill="none" stroke-dasharray="8 6"/><text x="128.8" y="194" font-size="21" font-weight="800" fill="#2f5241" text-anchor="middle">아이스픽</text><text x="328.8" y="194" font-size="21" font-weight="800" fill="#2f5241" text-anchor="middle">박스카</text><text x="528.8" y="194" font-size="21" font-weight="800" fill="#2f5241" text-anchor="middle">롤링</text><text x="748" y="220" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">아이스픽</text><text x="748" y="255" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">좁고 깊게 패임 → CO2 핀홀</text><text x="748" y="313" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">박스카</text><text x="748" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">경계가 뚜렷하고 바닥이 평평함 →</text><text x="748" y="378" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">니들RF·CO2 핀홀</text><text x="748" y="436" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">롤링</text><text x="748" y="470" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">아래로 당기는 섬유띠 →</text><text x="748" y="500" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">서브시전·스킨부스터</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>