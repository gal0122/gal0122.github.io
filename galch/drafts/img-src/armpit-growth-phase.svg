<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">한 시점에 성장기인 털의 비율</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">레이저는 성장기 모낭에 가장 잘 작용합니다.</text><text x="330" y="244" font-size="26" font-weight="800" fill="#24302a" text-anchor="end">얼굴 (인중·턱)</text><rect x="360" y="200" width="640" height="64" rx="14" fill="#efe8d8"/><rect x="360" y="200" width="416" height="64" rx="14" fill="#c9b98f"/><text x="794.0" y="243" font-size="24" font-weight="800" fill="#4d554f" text-anchor="start">60~70%</text><text x="330" y="354" font-size="26" font-weight="800" fill="#2f5241" text-anchor="end">겨드랑이</text><rect x="360" y="310" width="640" height="64" rx="14" fill="#efe8d8"/><rect x="360" y="310" width="192" height="64" rx="14" fill="#2f5241"/><text x="570.0" y="353" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">약 30%</text><text x="330" y="464" font-size="26" font-weight="800" fill="#24302a" text-anchor="end">팔·다리</text><rect x="360" y="420" width="640" height="64" rx="14" fill="#efe8d8"/><rect x="360" y="420" width="128" height="64" rx="14" fill="#c9b98f"/><text x="506.0" y="463" font-size="24" font-weight="800" fill="#4d554f" text-anchor="start">약 20%</text><rect x="60" y="512" width="1080" height="61" rx="16" fill="#eef3ef" stroke="#2f5241" stroke-width="2"/><circle cx="90" cy="545" r="7" fill="#2f5241"/><text x="108" y="552" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">기본 일정은 4주 간격 6회(1사이클, 약 6개월)이며, 털이 굵고 많으면 2사이클 이상이 필요할 수 있습니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>