<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">열을 전달하는 방식이 다릅니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">두 리프팅 모두 피부 속에 열을 만들어 콜라겐이 새로 만들어지도록 돕습니다.</text><rect x="60.0" y="170" width="524.0" height="293.0" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">초음파 · 리니어펌</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">정해진 깊이에 한 점처럼 모음</text><circle cx="100.0" cy="317.5" r="5" fill="#2f5241"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">2.0·3.0·4.5·6.0mm 깊이</text><circle cx="100.0" cy="359.0" r="5" fill="#2f5241"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">처진 윤곽과 턱선 정돈</text><circle cx="100.0" cy="400.5" r="5" fill="#2f5241"/><text x="118.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">볼 처짐, 이중턱</text><rect x="616.0" y="170" width="524.0" height="293.0" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#8a6d3b"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#8a6d3b" text-anchor="start">고주파 · 볼뉴머</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">넓고 고르게 퍼뜨림</text><circle cx="656.0" cy="317.5" r="5" fill="#8a6d3b"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">진피와 피하조직을 넓게 데움</text><circle cx="656.0" cy="359.0" r="5" fill="#8a6d3b"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">피부 탄력과 타이트닝</text><circle cx="656.0" cy="400.5" r="5" fill="#8a6d3b"/><text x="674.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">잔주름, 모공, 느슨한 피부</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>