<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">턱선이 흐려지는 세 가지 이유</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">원인에 따라 맞는 방법이 다릅니다.</text><rect x="60.0" y="170" width="344.0" height="236" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">처짐</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">조직이 아래로 내려옴</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">→ 리니어펌 · 코그실</text><rect x="428.0" y="170" width="344.0" height="236" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">턱 아래 지방</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">지방이 아주 많으면</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">리프팅만으로는 한계,</text><text x="456.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">체중 관리 함께</text><rect x="796.0" y="170" width="344.0" height="236" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">탄력 저하</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">피부가 얇고 느슨해짐</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">→ 볼뉴머</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>