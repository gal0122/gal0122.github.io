<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">스킨부스터, 작용하는 곳이 다릅니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">이름은 같아도 성분마다 목적이 다릅니다.</text><rect x="60" y="210" width="560" height="90" fill="#f1e2cf"/><rect x="60" y="300" width="560" height="230" fill="#ecd3c3"/><rect x="60" y="530" width="560" height="110" fill="#f6ead9"/><line x1="60" y1="300" x2="620" y2="300" stroke="#c9a98f" stroke-width="3" stroke-dasharray="10 8"/><text x="604" y="244" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">표피</text><text x="604" y="340" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">진피</text><text x="604" y="570" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">피하지방</text><line x1="60.19999999999999" y1="292" x2="560.2" y2="292" stroke="#c49a7c" stroke-width="10" opacity="0.6"/><text x="70.19999999999999" y="278" font-size="18" font-weight="700" fill="#7a6b42">기저층</text><circle cx="415.2" cy="420" r="34" fill="#f6efe2" stroke="#b9ab86" stroke-width="3"/><ellipse cx="415.2" cy="420" rx="14" ry="8" fill="#c9822f"/><circle cx="255.2" cy="292" r="19" fill="#2f5241" stroke="#fff" stroke-width="3"/><text x="255.2" y="299" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">1</text><circle cx="145.2" cy="360" r="19" fill="#2f5241" stroke="#fff" stroke-width="3"/><text x="145.2" y="367" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">2</text><circle cx="235.2" cy="410" r="19" fill="#2f5241" stroke="#fff" stroke-width="3"/><text x="235.2" y="417" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">3</text><circle cx="125.19999999999999" cy="470" r="19" fill="#2f5241" stroke="#fff" stroke-width="3"/><text x="125.19999999999999" y="47