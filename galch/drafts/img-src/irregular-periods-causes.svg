<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">생리불순, 원인부터 살핍니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">생리 주기는 보통 21~35일 사이이며 사람마다 조금씩 다릅니다.</text><rect x="60.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">생활의 변화</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">큰 스트레스</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">수면 부족, 생활 리듬 변화</text><rect x="428.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">체중·운동</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">짧은 기간의 체중 변화</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">갑자기 늘린 운동량</text><rect x="796.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">호르몬 · 임신</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">다낭성난소증후군, 갑상선 질환</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">늦어지면 임신 확인 먼저</text><rect x="60" y="398" width="1080" height="92" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="438" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="438" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">석 달 넘게 생리가 없거나, 양이 갑자기 늘었거나, 생리 기간이 아닌데 출혈이 있으면 산부인과 검사를 먼저</text><text x="108" y="468" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">받아 보세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>