<text x="60" y="122" font-size="22" fill="#5d655f">디스크 안쪽의 수핵이 밀려 나와 주변 신경을 누르면 허리와 다리에 통증·저림이 생길 수 있습니다.</text>
<g transform="translate(140,170)">
