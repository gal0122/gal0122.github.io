<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">기능성 소화불량, 이런 증상이 반복됩니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">위가 음식을 받아들이고 내려보내는 움직임이 둔해지고 예민해진 것과 관련이 있습니다.</text><rect x="60.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">식후 더부룩함</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">먹고 나면 오래</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">배가 더부룩함</text><rect x="428.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">조금만 먹어도 배부름</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">몇 숟가락만 먹어도</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">배가 찬 느낌</text><rect x="796.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">명치 통증</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">명치가 아프거나</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">쓰린 느낌</text><rect x="60" y="500" width="1080" height="92" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="540" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="540" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">40세 이후 새로 생긴 소화불량, 이유 없는 체중 감소, 검은 변, 삼키기 어려움이 있으면 내시경을 먼저</text><text x="108" y="570" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">받으세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>