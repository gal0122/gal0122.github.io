<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">화병은 이렇게 나타납니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">불안과 함께 오는 경우가 많습니다.</text><rect x="60.0" y="200" width="322.6666666666667" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="250" r="20" fill="#2f5241"/><text x="106.0" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">오래 참은 감정</text><text x="88.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">억울함, 분노를</text><text x="88.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">오래 참음</text><path d="M392.6666666666667 340.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="438.6666666666667" y="200" width="322.6666666666667" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="484.6666666666667" cy="250" r="20" fill="#2f5241"/><text x="484.6666666666667" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="518.6666666666667" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">몸의 증상</text><text x="466.6666666666667" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">가슴 답답함</text><text x="466.6666666666667" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">치밀어 오르는 열감</text><path d="M771.3333333333334 340.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="817.3333333333334" y="200" width="322.6666666666667" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="863.3333333333334" cy="250" r="20" fill="#2f5241"/><text x="863.3333333333334" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="897.3333333333334" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">함께 오는 것</text><text x="845.3333333333334" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">두근거림</text><text x="845.3333333333334" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">불면</text><rect x="60" y="516" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="556" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="556" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">가슴 통증이 운동할 때 심해지거나 식은땀·숨 가쁨이 함께 있으면 바로 응급실로 가세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>