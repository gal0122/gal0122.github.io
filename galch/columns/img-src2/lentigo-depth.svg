<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">흑자는 표피에 있는 색소입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">햇빛을 많이 받은 얼굴과 손등에 경계가 또렷한 갈색 반점으로 생깁니다.</text><rect x="60" y="210" width="640" height="90" fill="#f1e2cf"/><rect x="60" y="300" width="640" height="230" fill="#ecd3c3"/><rect x="60" y="530" width="640" height="110" fill="#f6ead9"/><line x1="60" y1="300" x2="700" y2="300" stroke="#c9a98f" stroke-width="3" stroke-dasharray="10 8"/><text x="684" y="244" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">표피</text><text x="684" y="340" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">진피</text><text x="684" y="570" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">피하지방</text><ellipse cx="328.8" cy="244" rx="120" ry="26" fill="#8a5a3c"/><text x="748" y="220" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">경계가 또렷함</text><text x="748" y="255" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">주변 피부와 선이 분명한 갈색 반점</text><text x="748" y="313" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">겨울에도 그대로</text><text x="748" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">주근깨와 달리 계절에 따라 옅어지지 않음</text><text x="748" y="406" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">파장 선택</text><text x="748" y="440" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">532nm·755nm·1064nm 가운데 진하기와</text><text x="748" y="470" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">깊이에 맞춰 고름</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>