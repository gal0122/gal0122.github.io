<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">손목터널증후군은 이렇게 생깁니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">손을 많이 쓰는 분, 임신 중이거나 갱년기 여성에게 흔합니다.</text><rect x="60.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">저린 손가락</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">엄지·검지·중지가</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">주로 저림</text><rect x="428.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">밤에 심해짐</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">밤이나 새벽에</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">저림이 심해짐</text><rect x="796.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">검사가 필요할 때</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">엄지 쪽 근육이 마르거나</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">힘이 빠질 때</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>