<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">피지선증식증은 피지선이 커진 것입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">이마와 볼, 코 주변에 2~5mm 크기로 생깁니다.</text><rect x="60" y="210" width="640" height="90" fill="#f1e2cf"/><rect x="60" y="300" width="640" height="230" fill="#ecd3c3"/><rect x="60" y="530" width="640" height="110" fill="#f6ead9"/><line x1="60" y1="300" x2="700" y2="300" stroke="#c9a98f" stroke-width="3" stroke-dasharray="10 8"/><text x="684" y="244" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">표피</text><text x="684" y="340" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">진피</text><text x="684" y="570" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">피하지방</text><path d="M248.8 212 q80.0 -44 160 0z" fill="#e9cf8c"/><ellipse cx="278.8" cy="350" rx="30" ry="24" fill="#e2c26e" stroke="#c9a54a" stroke-width="2"/><ellipse cx="378.8" cy="350" rx="30" ry="24" fill="#e2c26e" stroke="#c9a54a" stroke-width="2"/><ellipse cx="298.8" cy="400" rx="30" ry="24" fill="#e2c26e" stroke="#c9a54a" stroke-width="2"/><ellipse cx="358.8" cy="400" rx="30" ry="24" fill="#e2c26e" stroke="#c9a54a" stroke-width="2"/><ellipse cx="328.8" cy="370" rx="30" ry="24" fill="#e2c26e" stroke="#c9a54a" stroke-width="2"/><path d="M328.8 192 v160" stroke="#7a6b42" stroke-width="5"/><text x="748" y="220" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">노르스름한 돌기</text><text x="748" y="255" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">가운데가 살짝 패인 모양</text><text x="748" y="313" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">짜도 없어지지 않음</text><text x="748" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">중년 이후 피지가 많은 피부에 흔함</text><text x="748" y="406" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">다시 생기기 쉬움</text><text x="748" y="440" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">레이저로 필요한 깊이만큼 치료</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>