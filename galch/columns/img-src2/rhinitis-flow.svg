<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">비염은 이렇게 반복됩니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">집먼지진드기·꽃가루 같은 알레르기 원인이나 찬 공기·온도 변화가 증상을 일으킵니다.</text><rect x="60.0" y="200" width="322.6666666666667" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="250" r="20" fill="#2f5241"/><text x="106.0" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">원인</text><text x="88.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">집먼지진드기·꽃가루</text><text x="88.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">찬 공기·온도 변화</text><path d="M392.6666666666667 340.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="438.6666666666667" y="200" width="322.6666666666667" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="484.6666666666667" cy="250" r="20" fill="#2f5241"/><text x="484.6666666666667" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="518.6666666666667" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">예민한 코 점막</text><text x="466.6666666666667" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">작은 자극에도</text><text x="466.6666666666667" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">쉽게 반응</text><path d="M771.3333333333334 340.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="817.3333333333334" y="200" width="322.6666666666667" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="863.3333333333334" cy="250" r="20" fill="#2f5241"/><text x="863.3333333333334" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="897.3333333333334" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">증상</text><text x="845.3333333333334" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">재채기, 맑은 콧물</text><text x="845.3333333333334" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">코막힘, 코 가려움</text><rect x="60" y="516" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="556" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="556" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">누런 콧물과 얼굴 통증이 10일 넘게 계속되거나, 한쪽 코만 계속 막히면 이비인후과 진료를 먼저 받아 보세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>