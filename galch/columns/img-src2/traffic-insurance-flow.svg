<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">자동차보험 진료, 이렇게 진행됩니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">보험사에서 받은 접수번호만 있으면 자동차보험으로 진료받을 수 있습니다.</text><rect x="60.0" y="200" width="228.0" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="250" r="20" fill="#2f5241"/><text x="106.0" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">사고 접수</text><text x="88.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">보험사에</text><text x="88.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">사고를 접수</text><path d="M298.0 340.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="344.0" y="200" width="228.0" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="390.0" cy="250" r="20" fill="#2f5241"/><text x="390.0" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="424.0" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">접수번호</text><text x="372.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">보험사에서</text><text x="372.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">접수번호 받기</text><path d="M582.0 340.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="628.0" y="200" width="228.0" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="674.0" cy="250" r="20" fill="#2f5241"/><text x="674.0" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="708.0" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">내원</text><text x="656.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">접수번호와</text><text x="656.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">신분증 챙기기</text><path d="M866.0 340.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="912.0" y="200" width="228.0" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="958.0" cy="250" r="20" fill="#2f5241"/><text x="958.0" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="992.0" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">진료</text><text x="940.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">자동차보험으로</text><text x="940.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">진료 시작</text><rect x="60" y="516" width="1080" height="92" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="556" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="556" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">상대방이 접수를 해 주지 않으면 내 차 보험의 자동차상해·자기신체사고·무보험차상해로 접수할 수 있는지</text><text x="108" y="586" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">보험사에 확인하세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>