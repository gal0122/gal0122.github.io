<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">팔을 들 때 아픈 어깨, 원인이 여러 가지입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">원인에 따라 치료와 주의할 점이 달라집니다.</text><rect x="60.0" y="170" width="344.0" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">회전근개 손상</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">어깨를 움직이는</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">네 개의 힘줄 손상</text><rect x="428.0" y="170" width="344.0" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">충돌증후군</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">팔을 들 때 어깨뼈와</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">힘줄이 부딪히며 아픔</text><rect x="796.0" y="170" width="344.0" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">석회성 건염</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">힘줄에 석회가 쌓여</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">갑자기 심한 통증이 생기기도 함</text><rect x="60" y="490" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="530" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="530" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">다친 뒤 갑자기 팔을 전혀 들 수 없다면 힘줄 파열 여부를 먼저 확인하세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>