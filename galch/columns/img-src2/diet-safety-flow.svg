<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">다이어트 한약, 이렇게 확인하며 복용합니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">가슴 두근거림, 잠들기 어려움, 입마름·변비, 속 불편이 나타날 수 있습니다.</text><rect x="60.0" y="180" width="322.6666666666667" height="236" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="230" r="20" fill="#2f5241"/><text x="106.0" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">처방 전</text><text x="88.0" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">고혈압·심장·갑상선</text><text x="88.0" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">복용 중인 약</text><text x="88.0" y="358" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">임신·수유 여부 확인</text><path d="M392.6666666666667 298.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="438.6666666666667" y="180" width="322.6666666666667" height="236" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="484.6666666666667" cy="230" r="20" fill="#2f5241"/><text x="484.6666666666667" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="518.6666666666667" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">복용 중</text><text x="466.6666666666667" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">인바디로 근육·부종</text><text x="466.6666666666667" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">두근거림·잠·피로 확인</text><text x="466.6666666666667" y="358" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">처방과 복용 시간 조절</text><path d="M771.3333333333334 298.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="817.3333333333334" y="180" width="322.6666666666667" height="236" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="863.3333333333334" cy="230" r="20" fill="#2f5241"/><text x="863.3333333333334" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="897.3333333333334" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">이상이 있으면</text><text x="845.3333333333334" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">참지 말고</text><text x="845.3333333333334" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">바로 연락</text><rect x="60" y="444" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="484" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="484" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">임신 중이거나 모유 수유 중에는 다이어트 한약을 복용하지 않습니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>