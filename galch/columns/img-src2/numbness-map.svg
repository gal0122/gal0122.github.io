<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">저린 위치를 보면 원인이 보입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">어디가 어떻게 저린지가 중요한 단서입니다.</text><rect x="60.0" y="170" width="252.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">한쪽</text><text x="140.0" y="264" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">팔·손가락</text><text x="88.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">목·어깨 통증과 함께</text><text x="88.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">→ 목디스크</text><rect x="336.0" y="170" width="252.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="382.0" cy="220" r="20" fill="#2f5241"/><text x="382.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="416.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">엄지~약지,</text><text x="416.0" y="264" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">밤에</text><text x="364.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">손목 안쪽 신경 눌림</text><text x="364.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">→ 손목터널증후군</text><rect x="612.0" y="170" width="252.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="658.0" cy="220" r="20" fill="#2f5241"/><text x="658.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="692.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">한쪽 다리로</text><text x="692.0" y="264" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">뻗침</text><text x="640.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">엉덩이에서 다리로</text><text x="640.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">→ 허리디스크</text><rect x="888.0" y="170" width="252.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="934.0" cy="220" r="20" fill="#2f5241"/><text x="934.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="968.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">양쪽</text><text x="968.0" y="264" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">발끝부터</text><text x="916.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">장갑·양말처럼</text><text x="916.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">→ 말초신경병증</text><rect x="60" y="510" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="550" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="550" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">갑자기 한쪽 팔다리가 저리고 힘이 빠지면 뇌졸중일 수 있어 즉시 응급실로 가세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>