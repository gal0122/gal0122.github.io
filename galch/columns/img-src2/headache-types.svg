<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">자주 오는 두통, 대부분은 두 가지입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">어떤 두통인지에 따라 관리 방법이 달라집니다.</text><ellipse cx="220" cy="300" rx="90" ry="110" fill="#f0dcc7" stroke="#c9a98f" stroke-width="3"/><rect x="180" y="400" width="80" height="60" fill="#f0dcc7" stroke="#c9a98f" stroke-width="3"/><path d="M124 270 q96 -40 192 0" stroke="#a8452f" stroke-width="12" fill="none" stroke-linecap="round"/><ellipse cx="820" cy="300" rx="90" ry="110" fill="#f0dcc7" stroke="#c9a98f" stroke-width="3"/><rect x="780" y="400" width="80" height="60" fill="#f0dcc7" stroke="#c9a98f" stroke-width="3"/><path d="M760 240 a20 20 0 0 1 0 40" stroke="#a8452f" stroke-width="5" fill="none" opacity="1.0"/><path d="M746 240 a34 34 0 0 1 0 68" stroke="#a8452f" stroke-width="5" fill="none" opacity="0.65"/><path d="M732 240 a48 48 0 0 1 0 96" stroke="#a8452f" stroke-width="5" fill="none" opacity="0.30000000000000004"/><text x="220" y="500" font-size="28" font-weight="800" fill="#2f5241" text-anchor="middle">긴장성 두통</text><text x="220" y="540" font-size="21" font-weight="400" fill="#4d554f" text-anchor="middle">머리를 조이듯 아픔</text><text x="220" y="574" font-size="21" font-weight="400" fill="#4d554f" text-anchor="middle">목·어깨 긴장, 자세, 스트레스</text><text x="820" y="500" font-size="28" font-weight="800" fill="#a8452f" text-anchor="middle">편두통</text><text x="820" y="540" font-size="21" font-weight="400" fill="#4d554f" text-anchor="middle">한쪽이 욱신거림</text><text x="820" y="574" font-size="21" font-weight="400" fill="#4d554f" text-anchor="middle">빛·소리에 예민, 메스꺼움</text><rect x="60" y="616" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="656" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="656" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">평생 처음 겪는 극심한 두통, 팔다리 마비·말 어눌함·얼굴 처짐이 함께 있으면 바로 응급실로 가세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>