<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">점의 모양에 따라 제거 방법이 다릅니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">점은 색소 세포가 모여 생긴 양성 병변입니다.</text><rect x="60.0" y="170" width="524.0" height="320" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#4a3428"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#4a3428" text-anchor="start">평평한 점</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">색이 짙고 납작함</text><circle cx="100.0" cy="317.5" r="5" fill="#4a3428"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">피부를 깎지 않는</text><circle cx="100.0" cy="359.0" r="5" fill="#4a3428"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">아이스 점빼기</text><rect x="616.0" y="170" width="524.0" height="320" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">솟은 점 · 깊은 점</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">튀어나오거나 뿌리가 깊음</text><circle cx="656.0" cy="317.5" r="5" fill="#2f5241"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">유펄스 CO2로</text><circle cx="656.0" cy="359.0" r="5" fill="#2f5241"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">필요한 깊이만큼 제거</text><rect x="60" y="516" width="1080" height="92" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="556" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="556" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">모양이 비대칭이거나, 경계가 번지거나, 여러 색이 섞이거나, 6mm보다 크거나, 짧은 기간에 변한 점은 바로</text><text x="108" y="586" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">빼지 않고 먼저 확인합니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>