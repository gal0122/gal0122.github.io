<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">임신 중 교통사고, 이 순서로 확인하세요</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">사고가 가벼워 보여도 아기와 엄마 상태를 먼저 확인하는 것이 우선입니다.</text><rect x="60.0" y="180" width="322.6666666666667" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="230" r="20" fill="#2f5241"/><text x="106.0" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">산부인과 확인</text><text x="88.0" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">아프지 않아도</text><text x="88.0" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">먼저 확인</text><path d="M392.6666666666667 280.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="438.6666666666667" y="180" width="322.6666666666667" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="484.6666666666667" cy="230" r="20" fill="#2f5241"/><text x="484.6666666666667" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="518.6666666666667" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">임신 사실 알리기</text><text x="466.6666666666667" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">주수와</text><text x="466.6666666666667" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">산부인과 진료 내용</text><path d="M771.3333333333334 280.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="817.3333333333334" y="180" width="322.6666666666667" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="863.3333333333334" cy="230" r="20" fill="#2f5241"/><text x="863.3333333333334" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="897.3333333333334" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">조절한 진료</text><text x="845.3333333333334" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">엎드리지 않는 자세</text><text x="845.3333333333334" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">자극 조절, 한약은 신중히</text><rect x="60" y="408" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="448" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="448" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">배 통증, 출혈, 양수가 새는 느낌, 태동 감소가 있으면 바로 병원으로 가세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>