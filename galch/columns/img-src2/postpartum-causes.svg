"start">아기를 안고</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">돌보는 반복 동작</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>