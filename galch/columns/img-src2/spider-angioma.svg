<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">거미혈관종은 이런 모양입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">얼굴·목·가슴·손등에 잘 생기며 어린이와 임신 중에 흔합니다.</text><rect x="60" y="170" width="640" height="470" rx="24" fill="#f1e2cf"/><path d="M380.0 405.0 Q456.7272069853555 446.81497831445273 542.4072031513531 449.3280309992009" stroke="#d1344b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M380.0 405.0 Q408.53853184234947 480.8715077556302 472.1184918634235 531.0690105650505" stroke="#d1344b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M380.0 405.0 Q346.99636047985615 479.4269155000652 358.7265144495997 553.8208989865284" stroke="#d1344b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M380.0 405.0 Q300.89695884343433 443.1571423189912 255.2886373532645 506.9378348121512" stroke="#d1344b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M380.0 405.0 Q291.81074929654596 389.03321817746115 210.2045928517454 412.35692481632907" stroke="#d1344b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M380.0 405.0 Q323.9892702681509 342.3803287017108 244.56970642064587 314.3336279358348" stroke="#d1344b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M380.0 405.0 Q382.3758341712101 325.02787936655614 342.30415949538246 258.7341341886479" stroke="#d1344b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M380.0 405.0 Q439.6507188611045 345.09527406690864 457.676915284831 271.57406461862047" stroke="#d1344b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M380.0 405.0 Q469.014369251993 393.1927557982239 536.7037791297544 346.84547307763677" stroke="#d1344b" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="380.0" cy="405.0" r="20" fill="#c22a42"/><text x="380.0" y="625.0" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="middle">가운데 붉은 점 · 거미 다리처럼 뻗은 혈관</text><text x="748" y="210" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">누르면 사라짐</text><text x="748" y="245" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">가운데를 누르면 색이 사라졌다가 다시</text><text x="748" y="275" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">차오름</text><text x="748" y="333" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">대부분 문제없음</text><text x="748" y="368" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">어린이와 임신 중에 흔함</text><text x="748" y="426" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">어른에게 짧은 기간에 여러 개라면</text><text x="748" y="460" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">간 건강을 확인하는 검사를 받아 보세요</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>