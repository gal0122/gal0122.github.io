<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">이름이 헷갈리는 두 가지 혹</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">진짜 피지낭종은 피지선과 이어진 관에 생기는 주머니입니다.</text><rect x="60.0" y="170" width="524.0" height="400" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#8a6d3b"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#8a6d3b" text-anchor="start">표피낭종</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">흔히 피지낭종이라 부르는 혹</text><circle cx="100.0" cy="317.5" r="5" fill="#8a6d3b"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">치즈 같은 하얀 각질, 냄새</text><circle cx="100.0" cy="359.0" r="5" fill="#8a6d3b"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">가운데 구멍이 자주 보임</text><circle cx="100.0" cy="400.5" r="5" fill="#8a6d3b"/><text x="118.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">하나 또는 몇 개</text><circle cx="100.0" cy="442.0" r="5" fill="#8a6d3b"/><text x="118.0" y="449" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">얼굴, 귀 뒤, 목, 등</text><rect x="616.0" y="170" width="524.0" height="400" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">다발성 피지낭종</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">피지선과 이어진 관의 주머니</text><circle cx="656.0" cy="317.5" r="5" fill="#2f5241"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">기름 같은 노란 액체</text><circle cx="656.0" cy="359.0" r="5" fill="#2f5241"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">가운데 구멍은 대개 없음</text><circle cx="656.0" cy="400.5" r="5" fill="#2f5241"/><text x="674.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">여러 개, 많게는 수십 개</text><circle cx="656.0" cy="442.0" r="5" fill="#2f5241"/><text x="674.0" y="449" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">가슴·겨드랑이·팔·목</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>