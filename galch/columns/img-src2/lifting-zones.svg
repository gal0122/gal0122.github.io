<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">부위를 나눠 깊이와 에너지를 다르게 씁니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">얼굴 살이 적은 분이 깊은 층까지 강하게 받으면 볼이 더 말라 보일 수 있습니다.</text><rect x="60.0" y="170" width="524.0" height="293.0" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">볼륨을 지킬 곳</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">앞볼 · 관자놀이</text><circle cx="100.0" cy="317.5" r="5" fill="#2f5241"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">깊은 카트리지를 줄이고</text><circle cx="100.0" cy="359.0" r="5" fill="#2f5241"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">에너지를 낮춤</text><circle cx="100.0" cy="400.5" r="5" fill="#2f5241"/><text x="118.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">얇고 느슨하면 볼뉴머 고려</text><rect x="616.0" y="170" width="524.0" height="293.0" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#8a6d3b"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#8a6d3b" text-anchor="start">정돈이 필요한 곳</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">턱선 · 이중턱</text><circle cx="656.0" cy="317.5" r="5" fill="#8a6d3b"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">처진 윤곽을 정돈</text><circle cx="656.0" cy="359.0" r="5" fill="#8a6d3b"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">리니어펌을 부위에 맞게</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>