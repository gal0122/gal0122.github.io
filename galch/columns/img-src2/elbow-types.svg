<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">테니스 엘보와 골프 엘보</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">물건을 쥐거나 들 때 팔꿈치가 아픈 질환입니다.</text><rect x="60.0" y="170" width="524.0" height="300" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#8a6d3b"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#8a6d3b" text-anchor="start">테니스 엘보</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">팔꿈치 바깥쪽</text><circle cx="100.0" cy="317.5" r="5" fill="#8a6d3b"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">바깥쪽 힘줄의</text><circle cx="100.0" cy="359.0" r="5" fill="#8a6d3b"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">염증과 미세 손상</text><rect x="616.0" y="170" width="524.0" height="300" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">골프 엘보</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">팔꿈치 안쪽</text><circle cx="656.0" cy="317.5" r="5" fill="#2f5241"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">안쪽 힘줄의</text><circle cx="656.0" cy="359.0" r="5" fill="#2f5241"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">염증과 미세 손상</text><rect x="60" y="496" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="536" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="536" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">이름과 달리 집안일, 컴퓨터 작업, 무거운 짐 들기처럼 손목을 많이 쓰는 일로도 흔히 생깁니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>