<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">한공각화증은 고리 모양 반점입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">대부분 양성이지만 정확한 진단과 정기 확인이 중요합니다.</text><rect x="60" y="170" width="640" height="470" rx="24" fill="#f1e2cf"/><ellipse cx="380.0" cy="405.0" rx="190" ry="140" fill="#e6c9ad"/><ellipse cx="380.0" cy="405.0" rx="190" ry="140" fill="none" stroke="#8a5a3c" stroke-width="9"/><ellipse cx="380.0" cy="405.0" rx="182" ry="132" fill="none" stroke="#f3e2cc" stroke-width="3"/><text x="380.0" y="605.0" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="middle">테두리가 실처럼 가늘게 솟은 고리 모양</text><text x="748" y="210" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">고리 모양</text><text x="748" y="245" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">테두리가 실처럼 가늘게 솟음</text><text x="748" y="303" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">잘 생기는 곳</text><text x="748" y="338" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">햇빛을 많이 받은 팔다리, 얼굴</text><text x="748" y="396" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">정기 확인</text><text x="748" y="430" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">드물게 오래된 병변에서 피부암 사례가</text><text x="748" y="460" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">보고되어 변화를 살핌</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>