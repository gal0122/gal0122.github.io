<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">붉은 자국과 갈색 자국</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">자국은 피부 표면은 평평하고 색만 남은 상태입니다.</text><rect x="60.0" y="170" width="524.0" height="251.5" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#b5424f"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#b5424f" text-anchor="start">붉은 자국</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">염증 뒤 늘어난 모세혈관</text><circle cx="100.0" cy="317.5" r="5" fill="#b5424f"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">눌러 보면 잠시 옅어짐</text><circle cx="100.0" cy="359.0" r="5" fill="#b5424f"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">혈관 토닝 + 스킨부스터</text><rect x="616.0" y="170" width="524.0" height="251.5" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#8a6d3b"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#8a6d3b" text-anchor="start">갈색 자국</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">염증 뒤 남은 멜라닌 색소</text><circle cx="656.0" cy="317.5" r="5" fill="#8a6d3b"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">눌러도 색이 그대로</text><circle cx="656.0" cy="359.0" r="5" fill="#8a6d3b"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">색소 토닝 + 스킨부스터</text><rect x="60" y="449.5" width="1080" height="61" rx="16" fill="#eef3ef" stroke="#2f5241" stroke-width="2"/><circle cx="90" cy="482.5" r="7" fill="#2f5241"/><text x="108" y="490" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">회복 중인 피부는 자외선에 예민해 자국이 더 짙어질 수 있어 자외선 차단을 함께 지켜 주세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>