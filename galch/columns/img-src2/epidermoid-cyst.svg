<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">표피낭종은 피부 속 각질 주머니입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">가운데 작은 검은 구멍이 보이고, 누르면 냄새나는 하얀 내용물이 나오기도 합니다.</text><rect x="60" y="210" width="640" height="90" fill="#f1e2cf"/><rect x="60" y="300" width="640" height="230" fill="#ecd3c3"/><rect x="60" y="530" width="640" height="110" fill="#f6ead9"/><line x1="60" y1="300" x2="700" y2="300" stroke="#c9a98f" stroke-width="3" stroke-dasharray="10 8"/><text x="684" y="244" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">표피</text><text x="684" y="340" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">진피</text><text x="684" y="570" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">피하지방</text><circle cx="328.8" cy="400" r="90" fill="#fffaf0" stroke="#b9ab86" stroke-width="5"/><path d="M328.8 206 v104" stroke="#3b3b3b" stroke-width="8"/><circle cx="328.8" cy="210" r="7" fill="#3b3b3b"/><text x="328.8" y="408" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="middle">각질 주머니</text><text x="748" y="220" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">가운데 검은 구멍</text><text x="748" y="255" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">피부 표면과 이어진 작은 입구</text><text x="748" y="313" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">주머니가 핵심</text><text x="748" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">주머니가 남으면 다시 차오름</text><text x="748" y="406" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">치료</text><text x="748" y="440" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">CO2 레이저나 니들로 작은 구멍을 내어</text><text x="748" y="470" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">내용물과 주머니를 뺌</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>