<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">추나요법은 이렇게 진행합니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">근육을 먼저 충분히 풀고 상태에 맞게 강도를 정합니다.</text><rect x="60.0" y="180" width="228.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="230" r="20" fill="#2f5241"/><text x="106.0" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">진찰</text><text x="88.0" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">아픈 곳과</text><text x="88.0" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">자세·균형 확인</text><path d="M298.0 280.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="344.0" y="180" width="228.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="390.0" cy="230" r="20" fill="#2f5241"/><text x="390.0" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="424.0" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">물리치료</text><text x="372.0" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">굳은 근육을</text><text x="372.0" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">따뜻하게 풀기</text><path d="M582.0 280.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="628.0" y="180" width="228.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="674.0" cy="230" r="20" fill="#2f5241"/><text x="674.0" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="708.0" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">침·약침</text><text x="656.0" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">통증 부위</text><text x="656.0" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">풀어 주기</text><path d="M866.0 280.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="912.0" y="180" width="228.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="958.0" cy="230" r="20" fill="#2f5241"/><text x="958.0" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="992.0" y="238" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">추나</text><text x="940.0" y="286" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">척추와 골반</text><text x="940.0" y="322" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">바로잡기</text><rect x="60" y="408" width="1080" height="92" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="448" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="448" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">추나 뒤 하루 이틀 가벼운 뻐근함이 있을 수 있습니다. 골다공증, 수술 이력, 임신 중이라면 미리 알려</text><text x="108" y="478" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">주세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>