<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">신경이 지나는 길이 좁아진 상태</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">나이가 들며 인대가 두꺼워지고 뼈가 자라 척추관이 좁아지면 신경이 눌립니다.</text><rect x="60" y="170" width="524" height="420" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="212" y="210" width="220" height="130" rx="50" fill="#e8dfcf" stroke="#b9ab86" stroke-width="3"/><text x="322" y="282" font-size="21" font-weight="700" fill="#4d554f" text-anchor="middle">척추뼈</text><path d="M202 360 Q182 480 322 500 Q462 480 442 360" fill="none" stroke="#b9ab86" stroke-width="30" stroke-linecap="round"/><ellipse cx="322" cy="425" rx="72" ry="52" fill="none" stroke="#2f5241" stroke-width="3" stroke-dasharray="6 5"/><circle cx="322" cy="425" r="24" fill="#c9822f"/><text x="322" y="560" font-size="25" font-weight="800" fill="#2f5241" text-anchor="middle">정상 척추관</text><rect x="616" y="170" width="524" height="420" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="768" y="210" width="220" height="130" rx="50" fill="#e8dfcf" stroke="#b9ab86" stroke-width="3"/><text x="878" y="282" font-size="21" font-weight="700" fill="#4d554f" text-anchor="middle">척추뼈</text><path d="M758 360 Q738 480 878 500 Q1018 480 998 360" fill="none" stroke="#b9ab86" stroke-width="30" stroke-linecap="round"/><path d="M798 360 Q878 420 958 360" fill="#e2c26e" stroke="#c9a54a" stroke-width="3"/><path d="M808 470 Q878 430 948 470" fill="#e2c26e" stroke="#c9a54a" stroke-width="3"/><ellipse cx="878" cy="425" rx="46" ry="26" fill="none" stroke="#a8452f" stroke-width="3" stroke-dasharray="6 5"/><circle cx="878" cy="425" r="18" fill="#c9822f"/><text x="878" y="560" font-size="25" font-weight="800" fill="#a8452f" text-anchor="middle">좁아진 척추관</text><text x="1028" y="388" font-size="19" font-weight="700" fill="#7a6b42">두꺼워진</text><text x="1028" y="414" font-size="19" font-weight="700" fill="#7a6b42">인대</text><text x="472" y="432" font-size="19" font-weight="700" fill="#7a6b42">신경</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>