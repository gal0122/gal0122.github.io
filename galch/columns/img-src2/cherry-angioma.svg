<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">체리혈관종은 혈관이 뭉친 점입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">30대 이후 몸통과 팔에 하나둘 늘어나는 흔한 양성 병변입니다.</text><rect x="60" y="210" width="640" height="90" fill="#f1e2cf"/><rect x="60" y="300" width="640" height="230" fill="#ecd3c3"/><rect x="60" y="530" width="640" height="110" fill="#f6ead9"/><line x1="60" y1="300" x2="700" y2="300" stroke="#c9a98f" stroke-width="3" stroke-dasharray="10 8"/><text x="684" y="244" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">표피</text><text x="684" y="340" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">진피</text><text x="684" y="570" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">피하지방</text><path d="M268.8 212 q60.0 -72 120 0z" fill="#d1344b"/><circle cx="298.8" cy="320" r="16" fill="#d1344b" opacity="0.8"/><circle cx="338.8" cy="330" r="18" fill="#d1344b" opacity="0.8"/><circle cx="368.8" cy="314" r="12" fill="#d1344b" opacity="0.8"/><circle cx="320.8" cy="360" r="12" fill="#d1344b" opacity="0.8"/><text x="748" y="220" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">선홍색 작은 점</text><text x="748" y="255" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">작은 혈관이 늘어나 뭉침</text><text x="748" y="313" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">건강에 해롭지 않음</text><text x="748" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">피부암이 아니지만 긁히면 피가 날 수 있음</text><text x="748" y="406" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">치료</text><text x="748" y="440" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">1064nm 롱펄스 레이저 등으로 치료</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>