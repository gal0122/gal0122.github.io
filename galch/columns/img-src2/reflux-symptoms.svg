<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">역류성 식도염, 증상과 원인</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">생활 습관 교정이 치료의 기본입니다.</text><rect x="60.0" y="170" width="524.0" height="420" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#a8452f"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#a8452f" text-anchor="start">이런 증상</text><circle cx="100.0" cy="286.5" r="5" fill="#a8452f"/><text x="118.0" y="294" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">가슴 쓰림</text><circle cx="100.0" cy="328.0" r="5" fill="#a8452f"/><text x="118.0" y="335" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">신물이 올라옴</text><circle cx="100.0" cy="369.5" r="5" fill="#a8452f"/><text x="118.0" y="376" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">목에 뭔가 걸린 느낌</text><circle cx="100.0" cy="411.0" r="5" fill="#a8452f"/><text x="118.0" y="418" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">마른기침</text><rect x="616.0" y="170" width="524.0" height="420" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">흔한 원인</text><circle cx="656.0" cy="286.5" r="5" fill="#2f5241"/><text x="674.0" y="294" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">과식, 늦은 밤 식사</text><circle cx="656.0" cy="328.0" r="5" fill="#2f5241"/><text x="674.0" y="335" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">비만</text><circle cx="656.0" cy="369.5" r="5" fill="#2f5241"/><text x="674.0" y="376" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">술·커피·기름진 음식</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>