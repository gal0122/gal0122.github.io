<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">성장판이 닫히기까지</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">사춘기에 한 번 빠르게 자란 뒤 성장판이 닫히면서 키 성장이 멈춥니다.</text><line x1="210" y1="260" x2="990" y2="260" stroke="#b9ab86" stroke-width="6" stroke-linecap="round"/><circle cx="210.0" cy="260" r="22" fill="#2f5241" stroke="#fff" stroke-width="4"/><text x="210.0" y="214" font-size="25" font-weight="800" fill="#2f5241" text-anchor="middle">사춘기 전</text><text x="210.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">꾸준히 자라는 시기</text><text x="210.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">성장 상태 확인</text><circle cx="600.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="600.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">사춘기</text><text x="600.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">한동안 빠르게 자람</text><text x="600.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">닫힐 시기도 다가옴</text><circle cx="990.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="990.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">성장판 닫힘</text><text x="990.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">여아 대개 10대 중반</text><text x="990.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">남아 대개 10대 후반</text><rect x="60" y="438" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="478" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="478" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">여자아이 만 8세 전, 남자아이 만 9세 전에 사춘기 신호가 나타나면 소아청소년과 검사를 받아 보세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>