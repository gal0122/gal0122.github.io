<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">정형외과와 한의원, 함께 다니셔도 됩니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">같은 사고라면 같은 접수번호로 두 곳 모두 진료받을 수 있습니다.</text><rect x="60.0" y="170" width="524.0" height="330" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#4f6a85"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#4f6a85" text-anchor="start">정형외과</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">영상 검사로 확인</text><circle cx="100.0" cy="317.5" r="5" fill="#4f6a85"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">엑스레이·CT·MRI</text><circle cx="100.0" cy="359.0" r="5" fill="#4f6a85"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">뼈·관절·디스크·신경</text><circle cx="100.0" cy="400.5" r="5" fill="#4f6a85"/><text x="118.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">약물·주사·물리치료</text><rect x="616.0" y="170" width="524.0" height="330" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">한의원</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">진찰로 확인</text><circle cx="656.0" cy="317.5" r="5" fill="#2f5241"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">뭉친 근육, 틀어진 균형</text><circle cx="656.0" cy="359.0" r="5" fill="#2f5241"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">침·약침·추나·한약</text><circle cx="656.0" cy="400.5" r="5" fill="#2f5241"/><text x="674.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">뜸·부항·물리치료요법</text><rect x="60" y="526" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="566" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="566" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">다른 곳에서 받는 치료와 복용 중인 약, 검사 결과지를 알려 주시면 진료에 도움이 됩니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>