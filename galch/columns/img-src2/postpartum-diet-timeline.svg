<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">산후 다이어트, 시기에 따라 할 일이 다릅니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">출산 후에는 붓기, 체력 저하, 부족한 잠, 불규칙한 식사가 겹칩니다.</text><line x1="210" y1="260" x2="990" y2="260" stroke="#b9ab86" stroke-width="6" stroke-linecap="round"/><circle cx="210.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="210.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">출산 직후</text><text x="210.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">몸의 회복</text><text x="210.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">무리한 감량은 하지 않음</text><circle cx="600.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="600.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">수유 중</text><text x="600.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">세 끼를 챙기고</text><text x="600.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">단 음식·야식 줄이기</text><circle cx="990.0" cy="260" r="22" fill="#2f5241" stroke="#fff" stroke-width="4"/><text x="990.0" y="214" font-size="25" font-weight="800" fill="#2f5241" text-anchor="middle">수유가 끝난 뒤</text><text x="990.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">몸 상태 확인 후</text><text x="990.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">맞춤 처방과 식단 관리</text><rect x="60" y="438" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="478" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="478" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">모유 수유 중에는 다이어트 한약을 복용하지 않습니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>