<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">과실이 있어도 치료는 받을 수 있습니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">달라지는 것은 치료비를 어느 보험에서 처리하느냐입니다.</text><rect x="60.0" y="170" width="524.0" height="251.5" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">상대 차량 보험</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">상대 과실이 있는 사고</text><circle cx="100.0" cy="317.5" r="5" fill="#2f5241"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">상대 보험사에 접수</text><circle cx="100.0" cy="359.0" r="5" fill="#2f5241"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">접수번호로 진료 시작</text><rect x="616.0" y="170" width="524.0" height="251.5" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#8a6d3b"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#8a6d3b" text-anchor="start">내 차 보험</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">내 과실이 크거나 단독 사고</text><circle cx="656.0" cy="317.5" r="5" fill="#8a6d3b"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">자동차상해·자기신체사고 담보</text><circle cx="656.0" cy="359.0" r="5" fill="#8a6d3b"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">상대가 무보험이면 무보험차상해</text><rect x="60" y="449.5" width="1080" height="92" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="489.5" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="490" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">과실 비율과 다친 정도에 따라 상대 보험과 내 보험이 나누어 처리하는 경우도 있습니다. 담당 보험사에</text><text x="108" y="520" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">확인해 주세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>