<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">가려움과 긁기의 악순환</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">충분한 보습과 염증 관리로 이 고리를 끊는 것이 중요합니다.</text><rect x="60.0" y="200" width="228.0" height="260" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="250" r="20" fill="#2f5241"/><text x="106.0" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">가려움</text><text x="88.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">심한 가려움</text><path d="M298.0 330.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="344.0" y="200" width="228.0" height="260" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="390.0" cy="250" r="20" fill="#2f5241"/><text x="390.0" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="424.0" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">긁기</text><text x="372.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">참기 어려워 긁음</text><path d="M582.0 330.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="628.0" y="200" width="228.0" height="260" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="674.0" cy="250" r="20" fill="#2f5241"/><text x="674.0" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="708.0" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">장벽 손상</text><text x="656.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">수분이 빠지고</text><text x="656.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">자극에 약해짐</text><path d="M866.0 330.0 h36" stroke="#b9ab86" stroke-width="4" marker-end="url(#ar)"/><rect x="912.0" y="200" width="228.0" height="260" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="958.0" cy="250" r="20" fill="#2f5241"/><text x="958.0" y="258" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="992.0" y="258" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">염증</text><text x="940.0" y="306" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">붉은 습진</text><text x="940.0" y="342" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">→ 다시 가려움</text><rect x="60" y="496" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="536" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="536" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">충분한 보습으로 피부 장벽을 지키는 것이 생활 관리의 기본입니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>