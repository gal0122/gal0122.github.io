<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">교통사고 통증은 며칠 뒤에 나타나기도 합니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">통증이 시작되었다면 미루지 말고 진료를 받아 보시는 것이 좋습니다.</text><line x1="210" y1="330" x2="990" y2="330" stroke="#b9ab86" stroke-width="6" stroke-linecap="round"/><circle cx="210.0" cy="330" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="210.0" y="284" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">사고 직후</text><text x="210.0" y="388" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">놀라고 긴장해</text><text x="210.0" y="418" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">통증을 잘 못 느낌</text><circle cx="600.0" cy="330" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="600.0" y="284" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">며칠 뒤</text><text x="600.0" y="388" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">목·허리가 뻐근함</text><text x="600.0" y="418" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">두통·어지럼</text><circle cx="990.0" cy="330" r="22" fill="#2f5241" stroke="#fff" stroke-width="4"/><text x="990.0" y="284" font-size="25" font-weight="800" fill="#2f5241" text-anchor="middle">바로 진료</text><text x="990.0" y="388" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">통증이 시작되면</text><text x="990.0" y="418" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">미루지 말고 진료</text><rect x="60" y="550" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="590" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="590" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">의식을 잃었거나 팔다리에 힘이 빠지면 먼저 큰 병원에서 확인하세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>