<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">ABNOM은 진피에 있는 색소입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">광대 양쪽에 회갈색·푸르스름한 작은 반점이 모여 생깁니다.</text><rect x="60" y="210" width="640" height="90" fill="#f1e2cf"/><rect x="60" y="300" width="640" height="230" fill="#ecd3c3"/><rect x="60" y="530" width="640" height="110" fill="#f6ead9"/><line x1="60" y1="300" x2="700" y2="300" stroke="#c9a98f" stroke-width="3" stroke-dasharray="10 8"/><text x="684" y="244" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">표피</text><text x="684" y="340" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">진피</text><text x="684" y="570" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">피하지방</text><circle cx="268.8" cy="370" r="16" fill="#6f7b8c"/><circle cx="328.8" cy="420" r="14" fill="#6f7b8c"/><circle cx="378.8" cy="380" r="12" fill="#6f7b8c"/><circle cx="308.8" cy="470" r="12" fill="#6f7b8c"/><circle cx="408.8" cy="450" r="10" fill="#6f7b8c"/><text x="748" y="220" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">깊은 색소</text><text x="748" y="255" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">표피 아래 진피에 있어 회갈색으로 보임</text><text x="748" y="313" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">기미와 헷갈림</text><text x="748" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">비슷해 보이지만 색소 위치가 더 깊음</text><text x="748" y="406" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">긴 파장으로 여러 번</text><text x="748" y="440" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">깊이 닿는 1064nm로 간격을 두고 여러 번</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>