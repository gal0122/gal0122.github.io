<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">불면증은 두 가지로 나눠 봅니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">유형에 따라 살펴볼 원인과 관리 방법이 다릅니다.</text><rect x="60.0" y="170" width="524.0" height="420" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#4f6a85"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#4f6a85" text-anchor="start">잠들기 어려운 불면</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">수면 개시 장애</text><circle cx="100.0" cy="317.5" r="5" fill="#4f6a85"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">누워도 잠이 오지 않음</text><circle cx="100.0" cy="359.0" r="5" fill="#4f6a85"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">긴장과 생각</text><circle cx="100.0" cy="400.5" r="5" fill="#4f6a85"/><text x="118.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">늦어진 생활 리듬</text><circle cx="100.0" cy="442.0" r="5" fill="#4f6a85"/><text x="118.0" y="449" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">자기 전 화면·카페인</text><rect x="616.0" y="170" width="524.0" height="420" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">잠을 유지하기 어려운 불면</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">수면 유지 장애</text><circle cx="656.0" cy="317.5" r="5" fill="#2f5241"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">자주 깨거나</text><circle cx="656.0" cy="359.0" r="5" fill="#2f5241"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">새벽에 일찍 깸</text><circle cx="656.0" cy="400.5" r="5" fill="#2f5241"/><text x="674.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">다시 잠들기 어려움</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>