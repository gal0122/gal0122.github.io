<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">쥐젖은 이런 모양입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">피부암이 아니고 옮지도 않지만 저절로 없어지지 않습니다.</text><rect x="60" y="210" width="640" height="90" fill="#f1e2cf"/><rect x="60" y="300" width="640" height="230" fill="#ecd3c3"/><rect x="60" y="530" width="640" height="110" fill="#f6ead9"/><line x1="60" y1="300" x2="700" y2="300" stroke="#c9a98f" stroke-width="3" stroke-dasharray="10 8"/><text x="684" y="244" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">표피</text><text x="684" y="340" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">진피</text><text x="684" y="570" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">피하지방</text><path d="M316.8 212 q-6 -22 -30 -34 q18 -26 54 -8 q8 22 -4 42z" fill="#d9b49a" stroke="#b98d70" stroke-width="3"/><text x="748" y="220" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">잘 생기는 곳</text><text x="748" y="255" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">목, 겨드랑이, 눈가처럼 접히고 쓸리는 곳</text><text x="748" y="313" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">영향을 주는 것</text><text x="748" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">마찰, 체중 증가, 나이, 임신</text><text x="748" y="406" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">제거</text><text x="748" y="440" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">걸리거나 보기 싫다면 유펄스 CO2로 제거</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>