<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">증상에 따라 처방 방향이 다릅니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">침·약침과 추나가 아픈 부위를 살핀다면, 한약은 몸 전체의 회복을 돕습니다.</text><rect x="60.0" y="170" width="252.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">어혈</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">멍, 붓기,</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">찌르는 듯한 통증</text><rect x="336.0" y="170" width="252.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="382.0" cy="220" r="20" fill="#2f5241"/><text x="382.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="416.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">놀람 · 불면</text><text x="364.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">깜짝 놀람, 불안,</text><text x="364.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">잠 못 듦</text><rect x="612.0" y="170" width="252.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="658.0" cy="220" r="20" fill="#2f5241"/><text x="658.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="692.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">소화불량</text><text x="640.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">메스꺼움,</text><text x="640.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">입맛 없음</text><rect x="888.0" y="170" width="252.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="934.0" cy="220" r="20" fill="#2f5241"/><text x="934.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="968.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">굳은 근육</text><text x="916.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">쑤시는 통증,</text><text x="916.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">근육과 순환</text><rect x="60" y="398" width="1080" height="92" rx="16" fill="#eef3ef" stroke="#2f5241" stroke-width="2"/><circle cx="90" cy="431" r="7" fill="#2f5241"/><text x="108" y="438" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">복용 중인 약과 임신 여부, 간·콩팥 질환을 미리 알려 주세요. 보험 처리 범위는 담당 보험사에 확인해</text><text x="108" y="468" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">주세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>