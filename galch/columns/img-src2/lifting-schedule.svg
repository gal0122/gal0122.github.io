<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">리니어펌 권장 일정</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">콜라겐이 차오르는 데는 수주에서 수개월이 걸립니다.</text><line x1="210" y1="260" x2="990" y2="260" stroke="#b9ab86" stroke-width="6" stroke-linecap="round"/><circle cx="210.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="210.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">1회</text><text x="210.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">시작</text><circle cx="470.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="470.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">1달 뒤</text><text x="470.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">2회</text><circle cx="730.0" cy="260" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="730.0" y="214" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">2달 뒤</text><text x="730.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">3회</text><circle cx="990.0" cy="260" r="22" fill="#2f5241" stroke="#fff" stroke-width="4"/><text x="990.0" y="214" font-size="25" font-weight="800" fill="#2f5241" text-anchor="middle">6개월~1년</text><text x="990.0" y="318" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">유지 시술</text><rect x="60" y="438" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="478" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="478" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">같은 부위에 짧은 간격으로 강한 에너지를 반복하면 붉음, 화상, 볼 꺼짐 같은 부담이 커질 수 있습니다.</text><defs>