<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">수염은 왜 횟수가 많이 필요할까요?</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">레이저제모는 털이 자라는 성장기 모낭에 가장 잘 작용합니다.</text><rect x="60.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">굵고 진한 털</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">모낭이 크고 재생력이 강해</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">한두 번으로는 다시 자라기 쉬움</text><rect x="428.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">깊은 모낭</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">열이 깊은 곳까지 닿도록</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">파장과 조사 시간을 맞춤</text><rect x="796.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">빽빽한 털</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">차례로 성장기에 들어오는</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">모낭을 여러 번 나눠 만남</text><rect x="60" y="398" width="1080" height="92" rx="16" fill="#eef3ef" stroke="#2f5241" stroke-width="2"/><circle cx="90" cy="431" r="7" fill="#2f5241"/><text x="108" y="438" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">4주 간격 6회가 1사이클(약 6개월)입니다. 수염은 평균 12회 정도이며, 양이 많거나 굵으면 18~24회까지</text><text x="108" y="468" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">진행하기도 합니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>