<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">과민성 대장 증후군, 세 가지 유형</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">장이 예민해진 상태에 스트레스와 식습관이 더해져 증상이 오르내립니다.</text><rect x="60.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">설사형</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">묽은 변을 자주 봄</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">갑자기 급하게</text><text x="88.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">화장실을 찾음</text><rect x="428.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">변비형</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">변이 단단하고</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">배변이 힘듦</text><text x="456.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">배가 빵빵함</text><rect x="796.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">혼합형</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">설사와 변비가</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">번갈아 나타남</text><rect x="60" y="510" width="1080" height="92" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="550" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="550" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">변에 피가 섞이거나, 이유 없는 체중 감소가 있거나, 50세 이후 새로 생긴 배변 변화라면 대장내시경을 먼저</text><text x="108" y="580" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">받으세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>