<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">목디스크는 이렇게 생깁니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">고개를 오래 숙이는 자세와 일자목·거북목이 큰 원인입니다.</text><g transform="translate(140,180)"><rect x="0" y="0" width="360" height="110" rx="22" fill="#e8dfcf" stroke="#b9ab86" stroke-width="3"/><text x="180" y="64" font-size="24" font-weight="700" fill="#5d655f" text-anchor="middle">목뼈</text><rect x="18" y="122" width="324" height="62" rx="28" fill="#cfe0d4" stroke="#2f5241" stroke-width="3"/><ellipse cx="180" cy="153" rx="64" ry="18" fill="#2f5241"/><text x="180" y="160" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">수핵</text><rect x="0" y="196" width="360" height="110" rx="22" fill="#e8dfcf" stroke="#b9ab86" stroke-width="3"/><text x="180" y="260" font-size="24" font-weight="700" fill="#5d655f" text-anchor="middle">목뼈</text><text x="180" y="360" font-size="26" font-weight="800" fill="#2f5241" text-anchor="middle">정상 디스크</text></g><g transform="translate(680,180)"><rect x="0" y="0" width="360" height="110" rx="22" fill="#e8dfcf" stroke="#b9ab86" stroke-width="3"/><text x="180" y="64" font-size="24" font-weight="700" fill="#5d655f" text-anchor="middle">목뼈</text><rect x="18" y="122" width="324" height="62" rx="28" fill="#cfe0d4" stroke="#2f5241" stroke-width="3"/><path d="M140 138 q110 -8 190 14 q36 4 46 0 q-10 18 -46 18 q-76 22 -190 0z" fill="#2f5241"/><path d="M408 30 q-18 120 0 280" stroke="#c9822f" stroke-width="10" fill="none" stroke-linecap="round"/><text x="428" y="50" font-size="22" font-weight="700" fill="#c9822f">신경</text><circle cx="398" cy="153" r="28" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="6 5"/><rect x="0" y="196" width="360" height="110" rx="22" fill="#e8dfcf" stroke="#b9ab86" stroke-width="3"/><text x="180" y="260" font-size="24" font-weight="700" fill="#5d655f" text-anchor="middle">목뼈</text><text x="180" y="360" font-size="26" font-weight="800" fill="#24302a" text-anchor="middle">수핵이 밀려 나와 신경을 누름</text></g><rect x="60" y="580" width="1080" height="92" rx="16" fill="#fbf0ec" stroke="#2f5241" stroke-width="2"/><text x="84" y="620" font-size="22" font-weight="800" fill="#2f5241">!</text><text x="108" y="620" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">목과 어깨 통증, 팔과 손의 저림이 생길 수 있습니다. 손에 힘이 빠지거나 걸음이 불편해지면 먼저 검사가</text><text x="108" y="650" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">필요합니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>