<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">보행자·자전거 사고는 여러 곳을 함께 다칩니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">몸을 보호해 줄 차체가 없어 충격을 그대로 받습니다.</text><rect x="60.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">부딪힌 곳</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">차와 직접</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">부딪힌 부위</text><rect x="428.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">땅을 짚은 곳</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">넘어지며 짚은</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">손목·무릎·발목</text><rect x="796.0" y="170" width="344.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">함께 다치기 쉬운 곳</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">허리·어깨</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">며칠 뒤 아파 오기도</text><rect x="60" y="398" width="1080" height="92" rx="16" fill="#eef3ef" stroke="#2f5241" stroke-width="2"/><circle cx="90" cy="431" r="7" fill="#2f5241"/><text x="108" y="438" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">사고를 낸 차량의 보험사에 접수해 접수번호를 받으면 자동차보험으로 진료받을 수 있습니다. 차와 관계없이</text><text x="108" y="468" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">혼자 넘어진 경우는 대상이 아닐 수 있습니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>