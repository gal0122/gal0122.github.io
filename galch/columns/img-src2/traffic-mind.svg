<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">몸만 다치는 것이 아닙니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">놀란 몸과 마음이 아직 가라앉지 않아 생기는 흔한 반응입니다.</text><rect x="60.0" y="170" width="252.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">잠</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">잠들기 어렵거나</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">자주 깸</text><rect x="336.0" y="170" width="252.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="382.0" cy="220" r="20" fill="#2f5241"/><text x="382.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="416.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">놀람</text><text x="364.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">작은 소리에도</text><text x="364.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">가슴이 두근거림</text><rect x="612.0" y="170" width="252.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="658.0" cy="220" r="20" fill="#2f5241"/><text x="658.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="692.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">운전 불안</text><text x="640.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">차에 타기가</text><text x="640.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">두려움</text><rect x="888.0" y="170" width="252.0" height="200" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="934.0" cy="220" r="20" fill="#2f5241"/><text x="934.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="968.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">예민함</text><text x="916.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">신경이 날카롭고</text><text x="916.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">집중이 안 됨</text><rect x="60" y="398" width="1080" height="61" rx="16" fill="#eef3ef" stroke="#2f5241" stroke-width="2"/><circle cx="90" cy="431" r="7" fill="#2f5241"/><text x="108" y="438" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">사고 장면이 계속 떠오르거나 한 달이 지나도 일상이 힘들면 정신건강의학과 상담을 함께 받아 보세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>