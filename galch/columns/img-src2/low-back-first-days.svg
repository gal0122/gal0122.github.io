<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">허리를 삐끗했을 때, 처음 며칠</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">허리 주변 근육과 인대가 갑자기 늘어나 생기는 통증입니다.</text><rect x="60.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">무리하지 않기</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">처음 하루이틀은</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">허리를 숙여 물건을</text><text x="88.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">드는 동작을 피함</text><rect x="428.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">조금씩 움직이기</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">오래 누워 있기보다</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">아프지 않은 범위에서</text><text x="456.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">조금씩 움직임</text><rect x="796.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">다른 원인 확인</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">다리 저림이나 힘 빠짐이</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">함께 있으면 디스크 등</text><text x="824.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">다른 원인을 먼저 확인</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>