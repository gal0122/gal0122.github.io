<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">갱년기, 이런 증상이 나타납니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">증상의 종류와 정도는 사람마다 다릅니다.</text><rect x="60.0" y="170" width="344.0" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">열감·식은땀</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">얼굴이 화끈</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">달아오르고 식은땀</text><rect x="428.0" y="170" width="344.0" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">두근거림·불면</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">가슴이 두근거리고</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">잠을 설침</text><rect x="796.0" y="170" width="344.0" height="280" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">마음과 관절</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">예민함·우울감</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">관절통</text><rect x="60" y="490" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="530" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="530" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">폐경 후 다시 출혈이 있거나 두근거림이 심하면 산부인과와 내과 검사를 먼저 받아 보세요.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>