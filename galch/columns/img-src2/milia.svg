<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">비립종은 입구가 없는 작은 주머니입니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">피부 속에 각질이 갇혀 생긴 1~2mm 크기의 하얗고 단단한 좁쌀입니다.</text><rect x="60" y="210" width="640" height="90" fill="#f1e2cf"/><rect x="60" y="300" width="640" height="230" fill="#ecd3c3"/><rect x="60" y="530" width="640" height="110" fill="#f6ead9"/><line x1="60" y1="300" x2="700" y2="300" stroke="#c9a98f" stroke-width="3" stroke-dasharray="10 8"/><text x="684" y="244" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">표피</text><text x="684" y="340" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">진피</text><text x="684" y="570" font-size="19" font-weight="700" fill="#7a6b42" text-anchor="end">피하지방</text><circle cx="328.8" cy="318" r="22" fill="#ffffff" stroke="#cdbfa8" stroke-width="3"/><path d="M298.8 210 q30 -16 60 0" fill="#f1e2cf"/><text x="748" y="220" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">입구가 없음</text><text x="748" y="255" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">짜면 잘 나오지 않고 상처·자국만 남기 쉬움</text><text x="748" y="313" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">잘 생기는 곳</text><text x="748" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">눈가와 볼</text><text x="748" y="406" font-size="24" font-weight="800" fill="#2f5241" text-anchor="start">제거</text><text x="748" y="440" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">아주 작은 통로를 낸 뒤 내용물을 빼냄</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>