<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">오십견은 세 단계를 거칩니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">어깨 관절을 감싼 주머니에 염증이 생기고 굳어, 팔을 올리거나 뒤로 돌리기 어려워집니다.</text><line x1="210" y1="330" x2="990" y2="330" stroke="#b9ab86" stroke-width="6" stroke-linecap="round"/><circle cx="210.0" cy="330" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="210.0" y="284" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">① 아픈 시기</text><text x="210.0" y="388" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">통증이 심하고</text><text x="210.0" y="418" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">밤에 더 아픔</text><circle cx="600.0" cy="330" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="600.0" y="284" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">② 굳는 시기</text><text x="600.0" y="388" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">통증은 줄지만</text><text x="600.0" y="418" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">어깨가 굳어 움직임 제한</text><circle cx="990.0" cy="330" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="990.0" y="284" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">③ 풀리는 시기</text><text x="990.0" y="388" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">굳은 어깨가</text><text x="990.0" y="418" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">조금씩 풀림</text><rect x="60" y="550" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="590" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="590" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">통증을 줄이면서 굳은 어깨의 움직임을 되찾는 것이 치료의 목표입니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>