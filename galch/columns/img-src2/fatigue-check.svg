<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">만성 피로, 먼저 원인 질환을 확인하세요</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">충분히 쉬어도 몇 주 이상 피로가 이어진다면</text><rect x="60.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><text x="88.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">혈액·호르몬</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">빈혈</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">갑상선 기능 저하</text><text x="88.0" y="348" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">당뇨</text><rect x="428.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><text x="456.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">간·수면</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">간 질환</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">수면무호흡</text><rect x="796.0" y="170" width="344.0" height="300" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><text x="824.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">마음</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">우울증</text><rect x="60" y="500" width="1080" height="61" rx="16" fill="#fbf0ec" stroke="#2f5241" stroke-width="2"/><text x="84" y="540" font-size="22" font-weight="800" fill="#2f5241">!</text><text x="108" y="540" font-size="21" font-weight="600" fill="#2f5241" text-anchor="start">검사에서 이상이 없는데도 피곤하다면 생활 습관과 몸 상태를 함께 살펴 관리합니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>