<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">족저근막염, 이럴 때 아픕니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">오래 서 있거나 많이 걷는 분, 체중이 늘었거나 쿠션 없는 신발을 신는 분께 흔합니다.</text><rect x="60.0" y="170" width="344.0" height="320" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="106.0" cy="220" r="20" fill="#2f5241"/><text x="106.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">아침 첫발</text><text x="88.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">자고 일어나 첫발을</text><text x="88.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">디딜 때 찌르듯 아픔</text><rect x="428.0" y="170" width="344.0" height="320" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="474.0" cy="220" r="20" fill="#2f5241"/><text x="474.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="508.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">앉았다 일어날 때</text><text x="456.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">오래 앉아 있다가</text><text x="456.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">걷기 시작할 때</text><rect x="796.0" y="170" width="344.0" height="320" rx="22" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><circle cx="842.0" cy="220" r="20" fill="#2f5241"/><text x="842.0" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="876.0" y="228" font-size="25" font-weight="800" fill="#2f5241" text-anchor="start">걷다 보면</text><text x="824.0" y="276" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">몇 걸음 걸으면 나아지다가</text><text x="824.0" y="312" font-size="20" font-weight="400" fill="#4d554f" text-anchor="start">오래 걸으면 다시 아픔</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>