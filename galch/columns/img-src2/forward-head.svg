<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">머리가 앞으로 나올수록 목은 더 힘듭니다</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">옆에서 봤을 때 귀가 어깨보다 앞으로 나와 있는 자세가 굳은 상태가 거북목입니다.</text><rect x="60" y="170" width="524" height="470" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><path d="M200 570 L220 482 Q290 452 350 482 L370 570z" fill="#e8dfcf" stroke="#b9ab86" stroke-width="3"/><path d="M290 468 Q290.0 402 282 380" stroke="#ddc3aa" stroke-width="40" fill="none" stroke-linecap="round"/><circle cx="290" cy="322" r="70" fill="#f0dcc7" stroke="#c9a98f" stroke-width="3"/><path d="M358 318 l14 22 l-14 6" fill="#f0dcc7" stroke="#c9a98f" stroke-width="3"/><ellipse cx="282" cy="328" rx="10" ry="15" fill="#c9a98f"/><line x1="290" y1="262" x2="290" y2="502" stroke="#7a6b42" stroke-width="3" stroke-dasharray="8 8"/><text x="322" y="220" font-size="28" font-weight="800" fill="#2f5241" text-anchor="middle">바른 자세</text><text x="322" y="604" font-size="19" font-weight="600" fill="#4d554f" text-anchor="middle">귀가 어깨 위에 있어 목뼈가 무게를 받침</text><rect x="616" y="170" width="524" height="470" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><path d="M756 570 L776 482 Q846 452 906 482 L926 570z" fill="#e8dfcf" stroke="#b9ab86" stroke-width="3"/><path d="M846 468 Q862.5 402 948 380" stroke="#ddc3aa" stroke-width="40" fill="none" stroke-linecap="round"/><circle cx="956" cy="322" r="70" fill="#f0dcc7" stroke="#c9a98f" stroke-width="3"/><path d="M1024 318 l14 22 l-14 6" fill="#f0dcc7" stroke="#c9a98f" stroke-width="3"/><ellipse cx="948" cy="328" rx="10" ry="15" fill="#c9a98f"/><line x1="846" y1="262" x2="846" y2="502" stroke="#7a6b42" stroke-width="3" stroke-dasharray="8 8"/><path d="M816 442 Q816 382 886 362" stroke="#a8452f" stroke-width="5" fill="none" stroke-dasharray="10 7"/><text x="802" y="392" font-size="18" font-weight="700" fill="#a8452f" text-anchor="end">긴장한</text><text x="802" y="416" font-size="18" font-weight="700" fill="#a8452f" text-anchor="end">뒷목 근육</text><text x="878" y="220" font-size="28" font-weight="800" fill="#a8452f" text-anchor="middle">거북목</text><text x="878" y="604" font-size="19" font-weight="600" fill="#4d554f" text-anchor="middle">머리가 앞으로 나올수록 뒷목·어깨 근육이 끌어당겨</text><text x="878" y="632" font-size="19" font-weight="600" fill="#4d554f" text-anchor="middle">버팀</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>