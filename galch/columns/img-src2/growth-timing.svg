<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">키가 자랄 수 있는 시기</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">사춘기가 시작되면 성장판이 닫히기까지 남은 시간이 짧아집니다.</text><line x1="210" y1="330" x2="990" y2="330" stroke="#b9ab86" stroke-width="6" stroke-linecap="round"/><circle cx="210.0" cy="330" r="22" fill="#2f5241" stroke="#fff" stroke-width="4"/><text x="210.0" y="284" font-size="25" font-weight="800" fill="#2f5241" text-anchor="middle">초등학생</text><text x="210.0" y="388" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">2차 성징 전</text><text x="210.0" y="418" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">성장 상태 확인·관리 시작</text><circle cx="600.0" cy="330" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="600.0" y="284" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">2차 성징</text><text x="600.0" y="388" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">사춘기가 시작되면</text><text x="600.0" y="418" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">남은 시간이 짧아짐</text><circle cx="990.0" cy="330" r="16" fill="#d7c9a7" stroke="#fff" stroke-width="4"/><text x="990.0" y="284" font-size="25" font-weight="800" fill="#24302a" text-anchor="middle">성장판 닫힘</text><text x="990.0" y="388" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">이후에는 키가</text><text x="990.0" y="418" font-size="20" font-weight="400" fill="#4d554f" text-anchor="middle">더 자라기 어려움</text><rect x="60" y="550" width="1080" height="92" rx="16" fill="#fbf0ec" stroke="#a8452f" stroke-width="2"/><text x="84" y="590" font-size="22" font-weight="800" fill="#a8452f">!</text><text x="108" y="590" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">한의원의 성장 관리는 키를 직접 늘리는 것이 아니라 소화·수면·잦은 감기처럼 성장을 방해하는 요인을</text><text x="108" y="620" font-size="21" font-weight="600" fill="#a8452f" text-anchor="start">살피는 것입니다.</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>