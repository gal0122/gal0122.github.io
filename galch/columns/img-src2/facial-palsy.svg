<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Pretendard, sans-serif"><rect width="1200" height="720" fill="#faf7f0"/><text x="60" y="78" font-size="38" font-weight="800" fill="#24302a" text-anchor="start">안면마비, 먼저 이것을 구분하세요</text><text x="60" y="122" font-size="22" font-weight="400" fill="#5d655f" text-anchor="start">얼굴 근육을 움직이는 신경에 염증과 붓기가 생겨 갑자기 생깁니다.</text><rect x="60.0" y="170" width="524.0" height="380" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="60.0" y="170" width="524.0" height="12" rx="6" fill="#2f5241"/><text x="92.0" y="236" font-size="30" font-weight="800" fill="#2f5241" text-anchor="start">안면마비(벨마비)</text><text x="92.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">얼굴 한쪽만</text><circle cx="100.0" cy="317.5" r="5" fill="#2f5241"/><text x="118.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">한쪽 눈이 잘 감기지 않음</text><circle cx="100.0" cy="359.0" r="5" fill="#2f5241"/><text x="118.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">입이 한쪽으로 돌아감</text><circle cx="100.0" cy="400.5" r="5" fill="#2f5241"/><text x="118.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">초기 치료가 중요</text><rect x="616.0" y="170" width="524.0" height="380" rx="24" fill="#ffffff" stroke="#e2dccd" stroke-width="2"/><rect x="616.0" y="170" width="524.0" height="12" rx="6" fill="#a8452f"/><text x="648.0" y="236" font-size="30" font-weight="800" fill="#a8452f" text-anchor="start">바로 응급실</text><text x="648.0" y="282" font-size="20" font-weight="700" fill="#7a6b42" text-anchor="start">뇌졸중 의심 신호</text><circle cx="656.0" cy="317.5" r="5" fill="#a8452f"/><text x="674.0" y="324" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">팔다리 힘 빠짐</text><circle cx="656.0" cy="359.0" r="5" fill="#a8452f"/><text x="674.0" y="366" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">말이 어눌해짐</text><circle cx="656.0" cy="400.5" r="5" fill="#a8452f"/><text x="674.0" y="408" font-size="21" font-weight="400" fill="#4d554f" text-anchor="start">이마는 움직이는데 입 주변만 마비</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9ab86"/></marker></defs></svg>